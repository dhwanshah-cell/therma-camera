name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w shared
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w server && npm run build -w web
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - run: cd mobile && chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: robodog-debug-apk, path: mobile/app/build/outputs/apk/debug/app-debug.apk }
