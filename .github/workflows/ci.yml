name: Build and publish
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  node:
    name: Backend, web and shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w shared
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w server && npm run build -w web

  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install NDK and CMake (SDK is preinstalled on ubuntu runners)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > mobile/local.properties
      - name: Build and test
        run: |
          cd mobile
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon -ProbodogVersionCode=${{ github.run_number }} -ProbodogCommit=${{ github.sha }}
          cp app/build/outputs/apk/debug/app-debug.apk ../robodog.apk
          cd ..
          printf '{"versionCode":%s,"versionName":"0.1.%s","commit":"%s","builtAt":"%s","apkUrl":"https://github.com/%s/releases/download/latest-apk/robodog.apk"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.repository }}" > version.json
          cat version.json
      - uses: actions/upload-artifact@v4
        with: { name: robodog-apk, path: robodog.apk }
      - name: Publish APK at a fixed download link (releases/latest-apk)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="RoboDog Android app build ${GITHUB_RUN_NUMBER} (version 0.1.${GITHUB_RUN_NUMBER}) from ${GITHUB_SHA::7} on branch ${GITHUB_REF_NAME}.
          Already installed? Open the app: Settings > App update > INSTALL UPDATE (or the UPDATE banner on HOME).
          Open this page on the phone, download robodog.apk, tap it and allow the install.
          Storage on the phone: Pictures/RoboDog/Thermal/Images, Movies/RoboDog/Thermal/Videos, Documents/RoboDog/Thermal/Maps, Pictures/RoboDog/RGB/Images."
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk robodog.apk version.json --clobber
            gh release edit latest-apk --notes "$NOTES"
          else
            gh release create latest-apk robodog.apk version.json --prerelease --title "RoboDog app (latest build)" --notes "$NOTES"
          fi
