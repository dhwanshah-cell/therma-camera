<title>Code of Silence 2.0</title>
<meta name="description" content="Official trailer for CODE OF SILENCE 2.0 — a first-person mystery investigation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,900;1,500&display=swap">
<style>
/* Layout: one full-bleed cinema canvas; a single centred case-file gate before playback. One dark look by design. */
:root {
  --void: #030304;
  --ink: #ece8df;
  --ash: #8d8a84;
  --signal: #d8302c;
  --rule: rgba(236, 232, 223, .16);
  --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); overflow: hidden; }
[hidden] { display: none !important; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--void); }
#gate {
  position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; padding: 24px 16px;
  background: radial-gradient(ellipse at 50% 46%, rgba(216, 48, 44, .10), transparent 62%), var(--void);
}
.case { display: grid; gap: 20px; justify-items: center; text-align: center; max-width: 640px; }
.eyebrow { margin: 0; font: 500 12px/1.4 var(--mono); letter-spacing: .34em; color: var(--signal); text-transform: uppercase; }
h1 { margin: 0; font: 900 clamp(38px, 8vw, 84px)/.95 var(--serif); letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
h1 span { color: var(--signal); }
.note { margin: 0; font: 400 12px/1.7 var(--mono); letter-spacing: .14em; color: var(--ash); text-transform: uppercase; }
button {
  font: 600 13px/1 var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--ink);
  background: transparent; border: 1px solid var(--signal); padding: 16px 28px; cursor: pointer;
  transition: background .2s, color .2s;
}
button:hover:not(:disabled) { background: var(--signal); color: var(--void); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
button:disabled { border-color: var(--rule); color: var(--ash); cursor: progress; }
#replay { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 2; }
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>

<canvas id="view" aria-label="Code of Silence 2.0 trailer"></canvas>
<div id="gate">
  <div class="case">
    <p class="eyebrow">Case file: Verma · Classified</p>
    <h1>Code of Silence <span>2.0</span></h1>
    <p class="note">Official trailer · Sound on · Headphones recommended</p>
    <button id="play" type="button" disabled>Preparing evidence…</button>
    <p class="note">Space pause · R restart · F fullscreen</p>
  </div>
</div>
<button id="replay" type="button" hidden>Replay trailer</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

// ================================================================ CONFIG
const EVENT = { date: '[DATE]', time: '[TIME]', venue: '[VENUE]' };
const SENDER = 'Veema';            // the emails' sender, exactly as written in the case material
const DUR = 94;
const RENDER = new URLSearchParams(location.search).has('render');
const REDUCED = !RENDER && matchMedia('(prefers-reduced-motion: reduce)').matches;
const WH = 3.0, STRIDE = 0.7;

// ================================================================ UTIL
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
const hash = n => { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// step-wise keyed value: [[t, v], ...] -> value of last key <= t
const step = (keys, t) => { let v = keys[0][1]; for (const [k, x] of keys) { if (t >= k) v = x; else break; } return v; };
// linear keyed value
const ramp = (keys, t) => {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) { const [a, x] = keys[i - 1], [b, y] = keys[i]; return lerp(x, y, (t - a) / (b - a)); }
  return keys[keys.length - 1][1];
};
// fluorescent tube: long steady stretches broken by bursts of flicker
function tube(t, seed, onBias = .5) {
  const seg = Math.floor(t * 1.15 + seed * 3.7);
  if (hash(seg + seed * 17.3) > .55) return hash(seg * 3.1 + seed) < onBias ? 1 : 0;
  const r = hash(Math.floor(t * 17) + seed * 91.7);
  return r < .45 ? 0 : r < .6 ? .3 : 1;
}

const F = {
  serif: '"Playfair Display", Georgia, serif',
  mono: '"IBM Plex Mono", Menlo, monospace',
  type: '"Courier Prime", "Courier New", monospace',
  hand: 'Caveat, "Segoe Print", cursive',
  sans: 'Inter, Arial, sans-serif',
};
async function loadFonts() {
  const specs = ['900 40px "Playfair Display"', '700 40px "Playfair Display"', '600 40px "Playfair Display"', '500 40px "Playfair Display"',
    'italic 500 40px "Playfair Display"', '400 20px "IBM Plex Mono"', '500 20px "IBM Plex Mono"', '600 20px "IBM Plex Mono"',
    '400 20px "Courier Prime"', '700 20px "Courier Prime"', '600 20px Caveat', '400 20px Inter', '600 20px Inter', '700 20px Inter'];
  await Promise.race([Promise.all(specs.map(s => document.fonts.load(s).catch(() => {}))), new Promise(r => setTimeout(r, 8000))]);
}
await loadFonts();

// ================================================================ PROCEDURAL TEXTURES
function tileNoise(seed) {
  const R = rng(seed), N = 512, v = new Float32Array(N * N);
  for (let i = 0; i < v.length; i++) v[i] = R();
  return (x, y, px, py) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const x0 = ((xi % px) + px) % px, y0 = ((yi % py) + py) % py, x1 = (x0 + 1) % px, y1 = (y0 + 1) % py;
    const u = xf * xf * (3 - 2 * xf), w = yf * yf * (3 - 2 * yf);
    const a = v[y0 * N + x0], b = v[y0 * N + x1], c = v[y1 * N + x0], d = v[y1 * N + x1];
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  };
}
function fbm(n, u, v, fx, fy, oct) { let s = 0, a = .5, t = 0; for (let o = 0; o < oct; o++) { s += a * n(u * fx, v * fy, fx, fy); t += a; fx *= 2; fy *= 2; a *= .5; } return s / t; }
function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function tex(c, o = {}) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = o.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  if (o.repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}

function wallTex(seed) {
  const w = 640, h = 960, n1 = tileNoise(seed), n2 = tileNoise(seed + 5), n3 = tileNoise(seed + 9), R = rng(seed);
  const [c, x] = cv(w, h), [cb, xb] = cv(w, h);
  const im = x.createImageData(w, h), ib = xb.createImageData(w, h);
  for (let j = 0; j < h; j++) {
    const m = 3 * (1 - j / h);
    for (let i = 0; i < w; i++) {
      const u = i / w, v = j / h, o = (j * w + i) * 4;
      const f = fbm(n1, u, v, 4, 6, 5), b = fbm(n2, u, v, 2, 3, 3), s = fbm(n3, u, v, 48, 72, 1);
      let r, g, bl, bp;
      if (m < 1.1) { const k = .85 + (f - .5) * .3 - Math.max(0, b - .58) * .7 - (m < .1 ? .3 : 0); r = .2 * k; g = .23 * k; bl = .235 * k; bp = .55 + (f - .5) * .12; }
      else if (m < 1.15) { const k = .9 + (f - .5) * .2; r = .12 * k; g = .22 * k; bl = .23 * k; bp = .62; }
      else { const m2 = fbm(n3, u, v, 16, 24, 3), pore = hash(i * 7.13 + j * 3.71) < .012 ? -.12 : 0; const k = .5 + (f - .5) * .1 + (m2 - .5) * .1 + (s - .5) * .16 + pore - Math.max(0, b - .62) * .35; r = k * .97; g = k * .99; bl = k * 1.02; bp = .5 + (s - .5) * .7 + pore * 2 + (m2 - .5) * .2; }
      im.data[o] = r * 255; im.data[o + 1] = g * 255; im.data[o + 2] = bl * 255; im.data[o + 3] = 255;
      ib.data[o] = ib.data[o + 1] = ib.data[o + 2] = bp * 255; ib.data[o + 3] = 255;
    }
  }
  x.putImageData(im, 0, 0); xb.putImageData(ib, 0, 0);
  for (let k = 0; k < 9; k++) {
    const sx = R() * w, sy = R() * h * .3, len = h * (.12 + R() * .35), gr = x.createLinearGradient(0, sy, 0, sy + len);
    gr.addColorStop(0, 'rgba(18,16,12,.13)'); gr.addColorStop(1, 'rgba(18,16,12,0)');
    x.fillStyle = gr; x.fillRect(sx, sy, 1.5 + R() * 5, len);
  }
  for (const m of [1.75, 2.55]) for (const fx of [.25, .75]) {
    const px = fx * w, py = h * (1 - m / 3);
    x.fillStyle = 'rgba(10,10,10,.6)'; x.beginPath(); x.arc(px, py, 5, 0, 7); x.fill();
    xb.fillStyle = '#000'; xb.beginPath(); xb.arc(px, py, 6, 0, 7); xb.fill();
  }
  x.strokeStyle = 'rgba(210,210,200,.07)';
  for (let k = 0; k < 40; k++) {
    const sx = R() * w, sy = h * (1 - (.1 + R() * .95) / 3);
    x.lineWidth = 1 + R() * 2; x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx + 20 + R() * 60, sy + (R() - .5) * 8); x.stroke();
  }
  return { map: tex(c, { repeat: true }), bump: tex(cb, { repeat: true, linear: true }) };
}

function floorTex(seed) {
  const s = 1024, nA = tileNoise(seed), nB = tileNoise(seed + 3), R = rng(seed);
  const [c, x] = cv(s, s), [cr, xr] = cv(s, s), [cb, xb] = cv(s, s);
  const im = x.createImageData(s, s), ir = xr.createImageData(s, s), ib = xb.createImageData(s, s);
  for (let j = 0; j < s; j++) for (let i = 0; i < s; i++) {
    const u = i / s, v = j / s, tx = Math.floor(u * 4), ty = Math.floor(v * 4), fu = u * 4 - tx, fv = v * 4 - ty, o = (j * s + i) * 4;
    const chk = (tx + ty) & 1, tone = hash(tx * 7 + ty * 13 + seed) - .5;
    const sp = fbm(nA, u, v, 96, 96, 2), gr = fbm(nB, u, v, 3, 3, 4);
    const edge = Math.min(fu, 1 - fu, fv, 1 - fv);
    let k = (chk ? .5 : .38) + tone * .05 + (sp - .5) * .16 - Math.max(0, gr - .48) * .5;
    let rough = .3 + Math.max(0, gr - .4) * .9 + (sp - .5) * .1, bp = .62 + (sp - .5) * .08;
    if (edge < .007) { k *= .4; rough = .9; bp = .25; }
    im.data[o] = k * 255; im.data[o + 1] = k * .97 * 255; im.data[o + 2] = k * .9 * 255; im.data[o + 3] = 255;
    ir.data[o] = ir.data[o + 1] = ir.data[o + 2] = clamp(rough, 0, 1) * 255; ir.data[o + 3] = 255;
    ib.data[o] = ib.data[o + 1] = ib.data[o + 2] = bp * 255; ib.data[o + 3] = 255;
  }
  x.putImageData(im, 0, 0); xr.putImageData(ir, 0, 0); xb.putImageData(ib, 0, 0);
  x.strokeStyle = 'rgba(0,0,0,.14)';
  for (let k = 0; k < 70; k++) { x.lineWidth = 1 + R() * 3; x.beginPath(); const px = R() * s, py = R() * s; x.arc(px, py, 20 + R() * 80, R() * 6, R() * 6 + .6 + R()); x.stroke(); }
  return { map: tex(c, { repeat: true }), rough: tex(cr, { repeat: true, linear: true }), bump: tex(cb, { repeat: true, linear: true }) };
}

function ceilTex(seed) {
  const s = 512, n = tileNoise(seed), R = rng(seed);
  const [c, x] = cv(s, s), [cb, xb] = cv(s, s);
  const im = x.createImageData(s, s), ib = xb.createImageData(s, s);
  for (let j = 0; j < s; j++) for (let i = 0; i < s; i++) {
    const u = i / s, v = j / s, fu = (u * 2) % 1, fv = (v * 2) % 1, o = (j * s + i) * 4;
    const edge = Math.min(fu, 1 - fu, fv, 1 - fv), sp = fbm(n, u, v, 64, 64, 2);
    let k = .6 + (sp - .5) * .22, bp = .7 + (sp - .5) * .3;
    if (edge < .012) { k = .4; bp = .2; }
    im.data[o] = k * 255; im.data[o + 1] = k * .98 * 255; im.data[o + 2] = k * .94 * 255; im.data[o + 3] = 255;
    ib.data[o] = ib.data[o + 1] = ib.data[o + 2] = bp * 255; ib.data[o + 3] = 255;
  }
  x.putImageData(im, 0, 0); xb.putImageData(ib, 0, 0);
  for (let k = 0; k < 5; k++) {
    const px = R() * s, py = R() * s, r = 30 + R() * 70, g = x.createRadialGradient(px, py, r * .3, px, py, r);
    g.addColorStop(0, 'rgba(110,85,45,.18)'); g.addColorStop(.85, 'rgba(90,65,30,.28)'); g.addColorStop(1, 'rgba(90,65,30,0)');
    x.fillStyle = g; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  }
  return { map: tex(c, { repeat: true }), bump: tex(cb, { repeat: true, linear: true }) };
}

function paperBase(x, w, h, R, tone = '#d4cfc2') {
  x.fillStyle = tone; x.fillRect(0, 0, w, h);
  for (let k = 0; k < w * h / 300; k++) { x.fillStyle = `rgba(60,50,30,${R() * .05})`; x.fillRect(R() * w, R() * h, 1 + R() * 2, 1 + R() * 2); }
  const g = x.createRadialGradient(w / 2, h / 2, w * .3, w / 2, h / 2, w * .9);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(70,58,35,.2)');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
}
function crease(x, w, y) {
  const g = x.createLinearGradient(0, y - 7, 0, y + 7);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.42, 'rgba(0,0,0,.09)'); g.addColorStop(.55, 'rgba(255,255,255,.2)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, y - 7, w, 14);
}
function rule(x, x0, y, w, col, lw) { x.fillStyle = col; x.fillRect(x0, y, w, lw); }
function inkStamp(x, text, cx, cy, rot, R, size = 70, col = '#b3241f') {
  const [s, sx] = cv(600, 180);
  sx.strokeStyle = sx.fillStyle = col; sx.lineWidth = 7; sx.beginPath(); sx.roundRect(10, 10, 580, 160, 14); sx.stroke();
  sx.font = `700 ${size}px ${F.type}`; sx.textAlign = 'center'; sx.textBaseline = 'middle'; sx.fillText(text, 300, 94);
  sx.globalCompositeOperation = 'destination-out';
  for (let k = 0; k < 1100; k++) { sx.fillStyle = `rgba(0,0,0,${R() * .75})`; sx.fillRect(R() * 600, R() * 180, 1 + R() * 4, 1 + R() * 3); }
  x.save(); x.translate(cx, cy); x.rotate(rot); x.globalAlpha = .8; x.drawImage(s, -300, -90); x.restore();
}
function coffeeRing(x, cx, cy, r, R) {
  x.save(); x.strokeStyle = 'rgba(110,70,30,.22)';
  for (let k = 0; k < 4; k++) { x.lineWidth = 2 + R() * 5; x.beginPath(); x.arc(cx + R() * 4, cy + R() * 4, r + R() * 5, R() * 2, R() * 2 + 4.6 + R()); x.stroke(); }
  x.restore();
}

function docTex(seed) {
  const w = 256, h = 332, R = rng(seed), [c, x] = cv(w, h);
  paperBase(x, w, h, R);
  x.fillStyle = 'rgba(25,25,25,.8)'; x.fillRect(22, 24, 80 + R() * 70, 8);
  let y = 50;
  while (y < h - 30) {
    if (R() < .12) { y += 11; continue; }
    const lw = (w - 44) * (R() < .2 ? .35 + R() * .4 : .85 + R() * .15);
    x.fillStyle = `rgba(40,40,40,${.35 + R() * .25})`; x.fillRect(22, y, lw, 3.2); y += 9;
  }
  if (R() < .5) crease(x, w, h / 3);
  if (R() < .3) { x.fillStyle = 'rgba(15,15,15,.92)'; x.fillRect(22, 90 + R() * 150, 120 + R() * 60, 10); }
  return tex(c);
}

function emailTex(e, seed) {
  const w = 1024, h = 1325, R = rng(seed), [c, x] = cv(w, h), L = 78;
  paperBase(x, w, h, R);
  x.fillStyle = '#5d5a54'; x.font = `600 21px ${F.sans}`; x.letterSpacing = '4px';
  x.fillText('INTERNAL MAIL', L, 92);
  x.textAlign = 'right'; x.fillText('PRINTED COPY · 1 / 1', w - L, 92); x.textAlign = 'left'; x.letterSpacing = '0px';
  rule(x, L, 116, w - 2 * L, '#2b2a28', 2);
  [['From', e.from], ['To', e.to], ['Sent', null], ['Subject', '(no subject)']].forEach(([k, v], i) => {
    const y = 188 + i * 60;
    x.fillStyle = '#77746d'; x.font = `400 29px ${F.sans}`; x.fillText(k + ':', L, y);
    if (v) { x.fillStyle = '#1b1a18'; x.font = `600 33px ${F.sans}`; x.fillText(v, L + 160, y); return; }
    x.fillStyle = '#1d1c1a'; let px = L + 160;
    for (const bw of [58, 22, 46, 22, 70, 0, 40, 22, 40]) { if (!bw) { px += 20; continue; } x.fillRect(px, y - 24, bw, 28); px += bw + 8; }
    x.fillStyle = '#b4231f'; x.font = `600 18px ${F.mono}`; x.letterSpacing = '2px'; x.fillText('TIMESTAMP CORRUPTED', px + 18, y - 4); x.letterSpacing = '0px';
  });
  rule(x, L, 432, w - 2 * L, '#2b2a28', 2);
  x.fillStyle = '#121110'; x.font = `700 62px ${F.type}`;
  e.body.forEach((ln, i) => x.fillText(ln, L, 568 + i * 86));
  rule(x, L, h - 118, w - 2 * L, '#b9b5ab', 1);
  x.fillStyle = '#8a867e'; x.font = `500 17px ${F.mono}`; x.letterSpacing = '3px'; x.fillText('CONFIDENTIAL — NOT FOR DISTRIBUTION', L, h - 82); x.letterSpacing = '0px';
  crease(x, w, h / 3); crease(x, w, 2 * h / 3);
  inkStamp(x, 'EXHIBIT ' + e.ex, w - 310, h - 290, -.13 + (R() - .5) * .1, R);
  if (seed % 2) coffeeRing(x, 230 + R() * 500, 980 + R() * 120, 70, R);
  x.fillStyle = 'rgba(30,30,30,.35)'; x.beginPath(); x.arc(40, 40, 4, 0, 7); x.fill(); // staple hole
  return tex(c);
}

function signTex({ w = 512, h = 256, bg = '#e8e4da', head, headBg = '#b3201c', headFg = '#f2efe8', lines = [], fg = '#141414', size = 52, icon, font = F.sans, weight = 700 }) {
  const [c, x] = cv(w, h), R = rng(w + h + lines.length);
  x.fillStyle = bg; x.fillRect(0, 0, w, h);
  let top = 0;
  if (head) { x.fillStyle = headBg; x.fillRect(0, 0, w, h * .3); x.fillStyle = headFg; x.font = `800 ${h * .19}px ${F.sans}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.letterSpacing = '6px'; x.fillText(head, w / 2, h * .155); x.letterSpacing = '0px'; top = h * .3; }
  let cx = w / 2;
  if (icon === 'warn') {
    const s = h * .55, ix = h * .42, iy = top + (h - top) / 2;
    x.fillStyle = fg; x.beginPath(); x.moveTo(ix, iy - s / 2); x.lineTo(ix + s * .58, iy + s / 2); x.lineTo(ix - s * .58, iy + s / 2); x.closePath(); x.fill();
    x.fillStyle = bg; x.font = `900 ${s * .55}px ${F.sans}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('!', ix, iy + s * .12);
    cx = (w + ix + s * .6) / 2;
  }
  if (icon === 'rad') {
    const r = (h - top) * .38, ix = h * .5, iy = top + (h - top) / 2;
    x.fillStyle = fg;
    for (let k = 0; k < 3; k++) { const a = -Math.PI / 2 + k * Math.PI * 2 / 3 - Math.PI / 6; x.beginPath(); x.moveTo(ix, iy); x.arc(ix, iy, r, a, a + Math.PI / 3); x.closePath(); x.fill(); }
    x.fillStyle = bg; x.beginPath(); x.arc(ix, iy, r * .3, 0, 7); x.fill(); x.fillStyle = fg; x.beginPath(); x.arc(ix, iy, r * .2, 0, 7); x.fill();
    cx = (w + ix + r) / 2;
  }
